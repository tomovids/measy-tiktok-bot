name: Daily stats

# Reads the TikTok numbers, updates the auto-tuning and rebuilds the dashboard, twice a day.
on:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read the TikTok numbers
        run: python -m measybot stats
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the stats, tuning and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Stats $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
