name: Daily TikTok draft

on:
  schedule:
    # Every 30 minutes: each run builds whatever drafts are due (config.toml post_times, each account in
    # its own time zone) and not yet sent, so a run GitHub skips or delays is caught up by the next one,
    # and changing the times needs no change here. Runs with nothing due finish in under a minute.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make today's draft now, even before the posting time"
        type: boolean
        default: true
      again:
        description: "Send another draft even if today's was already sent (testing)"
        type: boolean
        default: false
      slot:
        description: "With 'again': which of the day's posts to copy (Measy: 1 = 07:30 Aldi, 2 = 12:00 tester store, 3 = 16:30 Aldi)"
        type: string
        default: ""
      account:
        description: "Only this account (measy, mealswithmeasy or ethaniscookingdaily); empty = every account"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build today's slides
        id: build
        run: python -m measybot build ${{ inputs.force && '--force' || '' }} ${{ inputs.again && '--again' || '' }} ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }} ${{ inputs.account && format('--account {0}', inputs.account) || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Pack the slides for the next job
        if: steps.build.outputs.built == 'true'
        run: mkdir -p state && tar czf workdir.tgz site/p state built.json

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workdir
          path: workdir.tgz
          retention-days: 7

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  send:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: workdir
          path: .
      - run: tar xzf workdir.tgz && rm workdir.tgz

      - name: Publish the slides on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send to TikTok drafts
        run: python -m measybot send
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the history and login
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Drafts $(date -u +%F)"
          git pull --rebase
          git push
