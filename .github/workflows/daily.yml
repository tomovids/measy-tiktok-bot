name: Daily TikTok draft

on:
  schedule:
    # Once an hour: each run builds every draft that's due (config.toml post_times, each account in its
    # own time zone) and not yet sent, so a run GitHub skips or delays is made up by the next one.
    # Runs with nothing due finish in under a minute.
    - cron: "17 * * * *"
    # plus just after each draft's send window opens (config.toml send_early_hours: 22:30 the evening
    # before the 06:30 draft, 09:00 for 12:00, 13:00 for 16:00, UK time), in summer and winter time
    - cron: "35 21 * * *"
    - cron: "35 22 * * *"
    - cron: "5 8 * * *"
    - cron: "5 9 * * *"
    - cron: "5 12 * * *"
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      # Manual or outside-timer runs only send what's due (config.toml send_early_hours) unless force is ticked.
      force:
        description: "Make ALL of today's drafts now, even before their times"
        type: boolean
        default: false
      again:
        description: "Send another draft even if today's was already sent (testing)"
        type: boolean
        default: false
      slot:
        description: "With 'again': which of the day's posts to copy (Measy: 1 = 07:30 Aldi, 2 = 12:00 tester store, 3 = 16:30 Aldi)"
        type: string
        default: ""
      account:
        description: "Only this account (measy, mealswithmeasy or ethaniscookingdaily); empty = every account"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build today's slides
        id: build
        run: python -m measybot build ${{ inputs.force && '--force' || '' }} ${{ inputs.again && '--again' || '' }} ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }} ${{ inputs.account && format('--account {0}', inputs.account) || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Pack the slides for the next job
        if: steps.build.outputs.built == 'true'
        run: mkdir -p state && tar czf workdir.tgz site/p state built.json

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workdir
          path: workdir.tgz
          retention-days: 7

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  send:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: workdir
          path: .
      - run: tar xzf workdir.tgz && rm workdir.tgz

      - name: Publish the slides on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send to TikTok drafts
        run: python -m measybot send
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the history and login
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Drafts $(date -u +%F)"
          # GitHub sometimes rejects a push for a moment (or another run just pushed): try a few times
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 20))
          done
          exit 1
