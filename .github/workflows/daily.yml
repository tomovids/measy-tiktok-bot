name: Daily TikTok draft

on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 UK summer time (BST)
    - cron: "30 7 * * *"   # 07:30 UK winter time (GMT); the bot skips if today's draft is done
  workflow_dispatch:
    inputs:
      force:
        description: "Make today's draft now, even before the posting time"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
      date: ${{ steps.build.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build today's slides
        id: build
        run: python -m measybot build ${{ inputs.force && '--force' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Pack the slides for the next job
        if: steps.build.outputs.built == 'true'
        run: mkdir -p state && tar czf workdir.tgz site/p state

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workdir
          path: workdir.tgz
          retention-days: 7

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  send:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: workdir
          path: .
      - run: tar xzf workdir.tgz && rm workdir.tgz

      - name: Publish the slides on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send to TikTok drafts
        run: python -m measybot send --date ${{ needs.build.outputs.date }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the history and login
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Draft for ${{ needs.build.outputs.date }}"
          git push
