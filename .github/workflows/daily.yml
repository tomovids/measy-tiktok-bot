name: Daily TikTok draft

on:
  schedule:
    # The three drafts a day (config.toml post_times 07:30, 12:00 and 16:30 UK time). Each time has a
    # summer (BST) and a winter (GMT) run; the bot only builds a draft that is due and not yet sent.
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make today's draft now, even before the posting time"
        type: boolean
        default: true
      again:
        description: "Send another draft even if today's was already sent (testing)"
        type: boolean
        default: false
      slot:
        description: "With 'again': which of the day's posts to copy (1 = 07:30 Aldi, 2 = 12:00 tester store, 3 = 16:30 Aldi)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
      date: ${{ steps.build.outputs.date }}
      post: ${{ steps.build.outputs.post }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build today's slides
        id: build
        run: python -m measybot build ${{ inputs.force && '--force' || '' }} ${{ inputs.again && '--again' || '' }} ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Pack the slides for the next job
        if: steps.build.outputs.built == 'true'
        run: mkdir -p state && tar czf workdir.tgz site/p state

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: workdir
          path: workdir.tgz
          retention-days: 7

      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  send:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: workdir
          path: .
      - run: tar xzf workdir.tgz && rm workdir.tgz

      - name: Publish the slides on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send to TikTok drafts
        run: python -m measybot send --date ${{ needs.build.outputs.date }} --post ${{ needs.build.outputs.post }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the history and login
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Draft for ${{ needs.build.outputs.date }}"
          git push
