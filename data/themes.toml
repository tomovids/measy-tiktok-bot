# Every post = one collection (which dishes) + one angle (why you need them today).
# Collections match dish tags (see measybot/tags.py); a dish fits if it has ANY of `any`
# and ALL of `all`. `hashtags` are added to the caption. Higher `weight` = picked more often.
# Angles can be limited to weekdays (Mon..Sun), to the "morning"/"afternoon" post, or to months.

[[collections]]
id = "anything"
label = "a mix of the best Aldi dinners"
any = []
weight = 3
hashtags = ["#dinnerideas", "#mealideas"]

