<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Measy bot login</title>
<style>
  :root { --bg: #f6f3ea; --ink: #13261c; --green: #1f6b3a; --box: #fff; --muted: #5b6b61; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1a14; --ink: #e8efe9; --box: #18261d; --muted: #9db0a3; --green: #6fcf8e; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 8px; color: var(--green); }
  p { color: var(--muted); }
  .code { background: var(--box); border: 2px solid var(--green); border-radius: 10px; padding: 14px;
          font: 15px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; margin: 16px 0; }
  button { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px;
           font-size: 16px; cursor: pointer; }
  .err { border-color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1 id="title">Measy bot: TikTok login</h1>
  <p id="help">Copy this code and paste it into the window where you ran <code>python -m measybot authorize</code>. It only works once and expires in a few minutes.</p>
  <div class="code" id="code">(no code in this link)</div>
  <button id="copy" type="button">Copy code</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error"), desc = q.get("error_description");
  const box = document.getElementById("code");
  if (code) {
    box.textContent = code;
  } else if (err) {
    box.textContent = err + (desc ? ": " + desc : "");
    box.classList.add("err");
    document.getElementById("help").textContent = "TikTok didn't give a code. Run authorize again.";
    document.getElementById("copy").hidden = true;
  } else {
    document.getElementById("copy").hidden = true;
  }
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Copied"; }
    catch (e) { getSelection().selectAllChildren(box); }
  });
</script>
</body>
</html>
