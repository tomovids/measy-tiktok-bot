# Measy TikTok slideshow bot settings. Edit freely; the next run picks them up.

[schedule]
# One draft per time (UK time). GitHub may start a few minutes late. The GitHub workflow runs at
# these times too: if you change them, change the cron lines in .github/workflows/daily.yml.
post_times = ["07:30", "12:00", "16:30"]
timezone = "Europe/London"

[store_rotation]
# Which supermarket each of the day's posts is about, in post_times order: a store id, or "rotate"
# = the next of the other stores in turn (Tesco, Sainsbury's, Asda, Lidl). Two Aldi posts and one
# tester post a day, to see how other supermarkets perform.
plan = ["aldi", "rotate", "aldi"]

[picker]
recipes_per_post = 5
# A dish isn't reused sooner than this unless the day's theme needs it (never twice in a day).
dish_cooldown_days = 4
# A collection (cheesy, chicken, fakeaway...) rests this many days before it's used again.
collection_gap_days = 4
# Random spread (days) so the same five dishes don't always travel together.
jitter_days = 3
max_same_protein = 3
max_same_base = 2
# 21 cards print prices in US dollars ($). Leave them out of UK posts.
skip_dollar_cards = true
# Which kinds of slide can be a recipe slide: "card" = the Measy recipe cards the bot draws
# (photo + full recipe). The original images: "poster" = photo of the meal, "full_recipe" =
# ingredients + method card, "ingredients" = ingredients card.
layouts = ["card"]

[openai]
text_model = "gpt-5-mini"
# Tried in order until one works (newest first).
image_models = ["gpt-image-2", "gpt-image-1.5", "gpt-image-1"]
image_size = "1024x1536"
# low (about 1c), medium (about 5c) or high (about 17-20c) per cover
image_quality = "medium"

# The supermarkets the posts rotate through (top 5 UK supermarkets by market share, all in the Measy
# app). Each post is about one of them: its store front on the cover, its name in the hook, its
# hashtags. The recipe cards are the same for every store. price_claims: £ claims allowed in the
# hook (the card prices are Aldi prices, so only Aldi). Add Morrisons, Waitrose, Co-op or M&S the
# same way.
[[stores]]
id = "tesco"
name = "Tesco"
words = ["tesco"]
sign = "the big red TESCO lettering with the blue dashed stripes underneath, on a white panel"
hashtags = ["#tesco", "#tescouk", "#tescofinds"]

[[stores]]
id = "sainsburys"
name = "Sainsbury's"
words = ["sainsbury"]
sign = "the orange Sainsbury's lettering on the facade"
hashtags = ["#sainsburys", "#sainsburysuk"]

[[stores]]
id = "asda"
name = "Asda"
words = ["asda"]
sign = "the large green ASDA lettering on the facade"
hashtags = ["#asda", "#asdauk", "#asdafinds"]

[[stores]]
id = "aldi"
name = "Aldi"
words = ["aldi"]
sign = "the blue Aldi logo sign with its yellow, orange and red border"
hashtags = ["#aldi", "#aldiuk", "#aldidinners"]
price_claims = true

[[stores]]
id = "lidl"
name = "Lidl"
words = ["lidl"]
sign = "the square Lidl logo sign (a yellow circle with a red ring and blue LIDL lettering, on a blue square)"
hashtags = ["#lidl", "#lidluk", "#lidlfinds"]

[cover]
prompt = """Photorealistic photo of the outside of a UK {store} supermarket store front: {sign} \
mounted high on the facade, large glass entrance doors, trolleys and a car park. {scene}. Tall vertical \
composition: the whole {store} sign sits in the TOP THIRD of the picture and is fully visible; the middle \
of the picture is plain facade or sky with nothing important in it (a caption will cover it); the \
entrance and car park fill the bottom. Bright, inviting, high-end advertising photography. No people in \
focus. No added text, captions, watermarks or words other than the {store} sign."""
# The bot picks one sky and one camera angle per day (weighted), so covers vary but stay bright.
skies = [
  { weight = 30, text = "Bright sunny day, deep blue sky with a few fluffy white clouds, crisp daylight" },
  { weight = 20, text = "Golden hour, warm low sun, orange and pink sky, long soft shadows" },
  { weight = 15, text = "Blue-hour dusk, deep blue sky, the store sign and shop windows glowing warmly" },
  { weight = 10, text = "Clear spring morning, trees in fresh green leaf beside the car park, soft sunshine" },
  { weight = 10, text = "Crisp autumn afternoon, golden trees, blue sky, a few leaves on the ground" },
  { weight = 8, text = "Evening just after rain, wet tarmac reflecting the glowing shop front, clearing sky" },
  { weight = 7, text = "Sunny summer evening, warm light on the facade, pastel sky" },
]
angles = [
  "low angle from the car park looking up at the store",
  "three-quarter view from the corner of the car park",
  "straight-on view from across the car park, symmetrical",
  "low angle close to the entrance, wide lens",
]
hook_font = "fonts/TikTokSans36pt-SemiBold.ttf"
arrow_font = "fonts/TikTokSans36pt-Bold.ttf"
emoji_font = "fonts/NotoColorEmoji.ttf"
hook_size = 62
subline_size = 50
# Vertical centre of the caption, as a share of the height (0.5 = middle).
text_y = 0.47
max_width = 0.88

[cards]
# The AI food photo on each recipe card (made once per dish, kept in images/photos/).
photo_prompt = """Ultra-appetising advertising food photograph of {dish}, made with {ingredients}. \
{angle}. A generous, heaped portion that looks irresistible: glossy sauce, {cheese}, crispy golden \
edges, juicy tender meat, a little steam rising. Show ONLY foods from this recipe; garnish only with \
ingredients it lists. Served in a rustic ceramic bowl \
or on a stoneware plate on a warm wooden table, a few loose ingredients and herbs scattered around. \
Warm golden side lighting, rich saturated colour, shallow depth of field with a soft creamy blurred \
background, hyper-detailed textures, high-end UK supermarket campaign and food magazine quality. \
The dish fills most of the frame. No text, no labels, no logos, no packaging, no hands, no people."""
photo_angles = [
  "Close-up hero shot from a low 30-degree angle",
  "Close-up from a 45-degree angle, slightly from above",
]
photo_size = "1536x1024"
photo_quality = "medium"
variants = 2

[words]
max_hook_chars = 64
max_subline_chars = 42
# Emoji the writer may use (all draw cleanly on the cover).
emoji = "😭😂😋😏😩😳👀💸🛒🍔⏰🔥🤤🙌👇💚😍🥲🤯💷🍝🍗🌮🧀🍚😴🫶"
# Hook tournament: how many hooks the writer drafts per post (the judge picks the best).
candidates = 6
# A hook sharing this share of its words with one of the last 60 hooks is rejected.
similar_threshold = 0.6

[brand]
# Words that must never appear in a hook, second line, intro or question (see data/brand.md).
# The post's own supermarket is allowed; every other supermarket stays banned.
avoid = ["aldi", "tesco", "lidl", "asda", "sainsbury", "morrisons", "waitrose", "iceland", "co-op",
         "m&s", "healthy", "weight loss", "guilt-free", "guilt free", "detox", "skinny", "clean eating"]

[caption]
cta = "Full recipes + the shopping list on the Measy app (link in bio) 📲"
# {store} becomes the post's supermarket.
save_lines = [
  "💾 Save this for your next {store} shop",
  "💾 Save this so you're not stuck for tea this week",
  "💾 Save it, screenshot it, send it to whoever does the cooking",
]
# Always used, after the store's own tags (e.g. #aldi #aldiuk); each theme adds two more (max_hashtags in total).
hashtags = ["#budgetmeals", "#easydinner", "#ukfood", "#measy"]
max_hashtags = 9

[tiktok]
# Turns on TikTok's "AI-generated" label (the cover is a realistic AI picture).
ai_generated = true
# Where GitHub Pages serves the slides. TikTok must have this address verified.
pages_base_url = "https://tomovids.github.io/measy-tiktok-bot/"
redirect_uri = "https://tomovids.github.io/measy-tiktok-bot/auth.html"
scopes = ["user.info.basic", "video.upload", "user.info.stats", "video.list"]

[tracking]
# The dashboard lives at <pages_base_url><dashboard_dir>/ (not linked from anywhere).
dashboard_dir = "insights-5c3xnv64"
# How many pages of 20 posts to read each day.
video_pages = 10
# Auto-tuning: starts after this many posts are 3+ days old; a prior of `prior_posts` average
# posts keeps one lucky post from swinging it; multipliers stay within min_mult..max_mult;
# `explore` of posts ignore the tuning so new ideas keep getting tried.
min_posts = 14
prior_posts = 3
min_mult = 0.5
max_mult = 2.0
explore = 0.25
top_hooks = 6

# The TikTok accounts the bot makes drafts for. The first one (Measy) keeps its files in state/;
# every other account has its own login, history, stats and dashboard in state/<id>/.
# Each account can set its own post_times, store_plan, stores and dashboard_dir; anything not set
# comes from the settings above. The two accounts never post the same dish on the same or the
# next day, and never reuse each other's hooks.
# Connect an account once with:  python -m measybot authorize --account <id>
# Changing post_times? Add matching cron lines in .github/workflows/daily.yml.
[[accounts]]
id = "measy"
name = "Measy"

[[accounts]]
id = "mealswithmeasy"
name = "Meals with Measy"
handle = "@mealswithmeasy"
post_times = ["09:30", "14:30"]
store_plan = ["rotate", "rotate"]
stores = ["tesco", "sainsburys", "asda", "lidl"]
dashboard_dir = "insights-96dd4441"
